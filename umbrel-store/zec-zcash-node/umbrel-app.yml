manifestVersion: 1.1
id: zec-zcash-node
category: finance
name: Zcash Node
version: 0.1.10
tagline: Run your own Zcash full node
description: >-
  Run a Zcash full node on umbrelOS, powered by Zebra or Zakura, with a
  lightwalletd wallet server so Vizor, Zodl, Ywallet, and Zingo can connect
  to your own node.
releaseNotes: >-
  Fix Insights fees, subsidy, and block size for Zebra. Median fee is in zat,
  rewards use the Zcash subsidy schedule, and peer Connected/Relay no longer
  invent Bitcoin-only fields Zebra does not send.
developer: Zcash Node
website: https://zebra.zfnd.org
dependencies: []
repo: https://github.com/zcash/zcash-node-gui
support: https://forum.zcashcommunity.com
port: 8230
gallery: []
path: ''
defaultUsername: ''
defaultPassword: ''
widgets:
  - id: stats
    type: four-stats
    refresh: 5s
    endpoint: app:3000/api/widget/stats
  - id: sync
    type: text-with-progress
    refresh: 2s
    endpoint: app:3000/api/widget/sync
backupIgnore:
  - data/zebra
  - data/zakura
  - data/lightwalletd
submitter: Community
submission: https://github.com/zcash/zcash-node-gui
