# docker-compose.yml — development stack only (prod compose lives in umbrel-store/)

version: '3.7'

networks:
  devnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.21.0.0/16

services:
  backend:
    user: '1000:1000'
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: dev
    working_dir: /repo
    volumes:
      - .:/repo
      - ./data/__node_modules_linux__:/repo/node_modules
      - ./data:/data
    command: >
      bash -c '
        set -e
        hash=$$(sha256sum /repo/package-lock.json | awk "{print \$$1}")
        stamp=/repo/node_modules/.linux_stamp
        if [ ! -f "$$stamp" ] || ! grep -q "$$hash" "$$stamp"; then
          echo "Installing workspaces (hash $$hash)…"
          npm ci --workspaces --include-workspace-root
          echo "$$hash" > "$$stamp"
        else
          echo "node_modules up-to-date (hash $$hash)"
        fi
        npm --workspace apps/backend run dev
      '
    healthcheck:
      test: ['CMD-SHELL', 'test -f /repo/node_modules/.linux_stamp']
      interval: 5s
      retries: 20
    ports:
      - '8233:8233'
      - '8232:8232'
      - '9067:9067'
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      CHAIN_STATE_DIR: /data/zebra
      ZAKURA_DIR: /data/zakura
      APP_STATE_DIR: /data/app
      LIGHTWALLETD_DIR: /data/lightwalletd
      APPS_SUBNET: '10.21.0.0/16'
      P2P_PORT: 8233
      RPC_PORT: 8232
      WALLET_PORT: 9067
      TOR_HOST: 10.21.22.10
      TOR_SOCKS_PORT: 9050
      TOR_CONTROL_PORT: 9051
      TOR_CONTROL_PASSWORD: supersecretpassword
      BITCOIND_IP: 10.21.21.8
      DEVICE_DOMAIN_NAME: 127.0.0.1
      P2P_HIDDEN_SERVICE: somehiddenservice.onion
      RPC_HIDDEN_SERVICE: someotherhiddenservice.onion
      WALLET_HIDDEN_SERVICE: wallethidden.onion
      DEFAULT_CHAIN: Testnet
    networks:
      devnet:
        ipv4_address: 10.21.21.8

  ui:
    user: '1000:1000'
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
    working_dir: /repo/apps/ui
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - .:/repo
      - ./data/__node_modules_linux__:/repo/node_modules
    command: ['npm', 'run', 'dev', '--', '--host']
    ports:
      - '5173:5173'
    environment:
      VITE_API_BASE: http://backend:3000
    networks: [devnet]

  tor:
    image: getumbrel/tor:0.4.7.8@sha256:2ace83f22501f58857fa9b403009f595137fa2e7986c4fda79d82a8119072b6a
    user: '1000:1000'
    restart: on-failure
    environment:
      HOME: '/tmp'
    entrypoint: >
      bash -c '
        TORRC=/tmp/torrc
        PASS="supersecretpassword"
        HASH=$$(tor --hash-password "$$PASS" | tail -n1)
        {
          echo "SocksPort 0.0.0.0:9050"
          echo "ControlPort 0.0.0.0:9051"
          echo "CookieAuthentication 1"
          echo "CookieAuthFileGroupReadable 1"
          echo "HashedControlPassword $$HASH"
        } > "$$TORRC"
        exec tor -f "$$TORRC"
      '
    networks:
      devnet:
        ipv4_address: 10.21.22.10
