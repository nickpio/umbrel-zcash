name: Docker Build and Push
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: false
        default: v0.1.0

jobs:
  build:
    name: Build and push to GitHub Container Registry
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set VERSION and TAG
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/*/}"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Setup Docker buildx
        run: docker buildx create --use

      - name: Run Docker buildx
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file apps/backend/Dockerfile \
            --build-arg VERSION=${{ env.VERSION }} \
            --tag ghcr.io/${{ github.repository }}:${{ env.TAG }} \
            --push .

  desktop:
    name: Linux desktop packages
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Set VERSION and TAG
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/*/}"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: npm ci

      - name: Build desktop packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            apps/desktop/release/zcash-node-*.AppImage
            apps/desktop/release/zcash-node-*.deb
            apps/desktop/release/zcash-node-*.tar.gz
          fail_on_unmatched_files: true
