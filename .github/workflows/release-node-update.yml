name: Release node update

# When a PR from update-node-releases.yml is merged: tag the app version it
# bumped to and publish the image and a GitHub Release. Distribution to Umbrel
# users is handled separately by the umbrel-app-store repository.
on:
  pull_request:
    types: [closed]
    branches: [master]

concurrency:
  group: release-node-update
  cancel-in-progress: false

jobs:
  tag:
    name: Tag release
    if: github.event.pull_request.merged && github.event.pull_request.head.ref == 'automation/node-releases'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Test release automation
        run: node --test scripts/*.test.mjs

      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Push tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          REMOTE_TAG=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ -n "$REMOTE_TAG" ]; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            if [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Tag $TAG already exists on a different commit. Bump package.json past it and re-run."
              exit 1
            fi
            echo "Tag $TAG already points to this commit; continuing the release."
            exit 0
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

  build:
    name: Publish image
    needs: tag
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/on-tag.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

  release:
    name: Publish GitHub Release
    needs: [tag, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create or reconcile release
        uses: actions/github-script@v7
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          TITLE: ${{ github.event.pull_request.title }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.tag.outputs.tag }}@${{ needs.build.outputs.digest }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        with:
          script: |
            const {TAG, TITLE, IMAGE, PR_URL} = process.env
            const target = {...context.repo, tag: TAG}
            let release
            try {
              const existing = await github.rest.repos.getReleaseByTag(target)
              release = existing.data
            } catch (error) {
              if (error.status !== 404) throw error
              const created = await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: TAG,
                name: `${TAG}: ${TITLE}`,
                body: [
                  TITLE,
                  '',
                  `Node update: ${PR_URL}`,
                  '',
                  `Container image: \`${IMAGE}\``,
                  '',
                  'The previous release of each node remains available as the pinned rollback preset under Settings.',
                ].join('\n'),
                draft: false,
                prerelease: false,
                generate_release_notes: true,
              })
              release = created.data
            }
            if (release.tag_name !== TAG || release.draft || release.prerelease) {
              throw new Error(`${TAG} is not a published stable release`)
            }
            const imageLine = `Container image: \`${IMAGE}\``
            const imagePattern = /^Container image: `[^`\r\n]*`[\t ]*$/gm
            const body = release.body ?? ''
            const updatedBody = imagePattern.test(body)
              ? body.replace(imagePattern, () => imageLine)
              : [body, imageLine].filter(Boolean).join('\n\n')
            if (updatedBody !== body) {
              await github.rest.repos.updateRelease({
                ...context.repo,
                release_id: release.id,
                body: updatedBody,
              })
            }
            const {data: verified} = await github.rest.repos.getReleaseByTag(target)
            if (verified.tag_name !== TAG || verified.draft || verified.prerelease) {
              throw new Error(`${TAG} is not a published stable release`)
            }
            if (!(verified.body ?? '').split(/\r?\n/).includes(imageLine)) {
              throw new Error(`${TAG} does not reference the current container image`)
            }
            core.info(`Published release: ${verified.html_url}`)
