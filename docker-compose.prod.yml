# docker-compose.prod.yml — for testing the production image

version: '3.7'

networks:
  devnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.21.0.0/16

services:
  app:
    image: zcash-node:prod
    user: '1000:1000'
    ports:
      - '3000:3000'
      - '8233:8233'
      - '127.0.0.1:8232:8232'
      - '9067:9067'
    volumes:
      - ./data:/data
    environment:
      CHAIN_STATE_DIR: /data/zebra
      ZAKURA_DIR: /data/zakura
      APP_STATE_DIR: /data/app
      LIGHTWALLETD_DIR: /data/lightwalletd
      P2P_PORT: 8233
      RPC_PORT: 8232
      WALLET_PORT: 9067
      BITCOIND_IP: 10.21.21.8
      DEVICE_DOMAIN_NAME: 127.0.0.1
      DEFAULT_CHAIN: Testnet
    networks:
      devnet:
        ipv4_address: 10.21.21.8
